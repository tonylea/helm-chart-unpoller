name: Linting

on:
  pull_request:

jobs:
  changes:
    uses: tonylea/ci-templates/.github/workflows/changes-helm-chart.yml@v1.3.0

  common:
    uses: tonylea/ci-templates/.github/workflows/linting-common.yml@v1.3.0

  helm:
    needs: [changes]
    if: needs.changes.outputs.chart == 'true'
    uses: tonylea/ci-templates/.github/workflows/linting-helm.yml@v1.3.0

  # The required check. Skipped jobs pass; failed or cancelled ones don't.
  linting:
    needs: [changes, common, helm]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every linting job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
