apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unpoller.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "unpoller.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 9130
      targetPort: metrics
