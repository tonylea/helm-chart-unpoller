suite: ServiceMonitor
templates:
  - templates/servicemonitor.yaml
  - templates/service.yaml
set:
  controllerUrl: https://unifi.example.com
  credentialsSecret: unpoller-unifi
tests:
  - it: adds the labels it is given
    template: templates/servicemonitor.yaml
    set:
      serviceMonitor:
        labels:
          example.com/scope: external
    asserts:
      - equal:
          path: metadata.labels["example.com/scope"]
          value: external
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: unpoller

  - it: scrapes the metrics port every 30s
    template: templates/servicemonitor.yaml
    asserts:
      - equal:
          path: spec.endpoints
          value:
            - port: metrics
              path: /metrics
              interval: 30s

  - it: serves metrics on 9130 inside the cluster only
    template: templates/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports
          value:
            - name: metrics
              port: 9130
              targetPort: metrics
